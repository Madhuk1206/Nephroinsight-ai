{% extends 'base.html' %}

{% block content %}
<div style="margin-bottom: 28px;">
    <h1 style="font-size: 1.75rem; margin-bottom: 4px;">Register New Patient</h1>
    <p>Create a new clinical profile to track diagnoses and perform CDSS kidney risk evaluations.</p>
</div>

<div class="form-card" style="max-width: 720px;">
    <form action="{{ url_for('patients.register') }}" method="POST">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="name" class="form-label">Full Name *</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="e.g. John Doe" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 0;">
                <label for="dob" class="form-label">Date of Birth *</label>
                <input type="date" id="dob" name="dob" class="form-input" required>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="gender" class="form-label">Gender *</label>
                <select id="gender" name="gender" class="form-input" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group" style="margin-bottom: 0;">
                <label for="contact" class="form-label">Contact Number *</label>
                <input type="text" id="contact" name="contact" class="form-input" placeholder="e.g. +1 555-0199" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Email Address (Optional)</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="e.g. j.doe@example.com">
        </div>

        <div class="form-group" style="margin-bottom: 28px;">
            <label for="address" class="form-label">Residential Address (Optional)</label>
            <textarea id="address" name="address" class="form-input" rows="3" placeholder="Street address, City, ZIP code..."></textarea>
        </div>

        <div style="display: flex; gap: 12px; border-top: 1px solid var(--border); padding-top: 24px;">
            <button type="submit" class="btn btn-primary">Create Profile</button>
            <a href="{{ url_for('patients.list_patients') }}" class="btn btn-secondary">Cancel</a>
        </div>
        
    </form>
</div>
{% endblock %}
