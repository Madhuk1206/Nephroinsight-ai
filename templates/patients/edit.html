{% extends 'base.html' %}

{% block content %}
<div style="margin-bottom: 28px;">
    <h1 style="font-size: 1.75rem; margin-bottom: 4px;">Edit Patient Profile</h1>
    <p>Modify patient demographics or contact records for <b>{{ patient.name }}</b> (ID: {{ patient.patient_id }}).</p>
</div>

<div class="form-card" style="max-width: 720px;">
    <form action="{{ url_for('patients.edit_patient', id=patient.id) }}" method="POST">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="name" class="form-label">Full Name *</label>
                <input type="text" id="name" name="name" class="form-input" value="{{ patient.name }}" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 0;">
                <label for="dob" class="form-label">Date of Birth *</label>
                <input type="date" id="dob" name="dob" class="form-input" value="{{ patient.dob.strftime('%Y-%m-%d') }}" required>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="gender" class="form-label">Gender *</label>
                <select id="gender" name="gender" class="form-input" required>
                    <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            
            <div class="form-group" style="margin-bottom: 0;">
                <label for="contact" class="form-label">Contact Number *</label>
                <input type="text" id="contact" name="contact" class="form-input" value="{{ patient.contact }}" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Email Address (Optional)</label>
            <input type="email" id="email" name="email" class="form-input" value="{{ patient.email or '' }}" placeholder="e.g. j.doe@example.com">
        </div>

        <div class="form-group" style="margin-bottom: 28px;">
            <label for="address" class="form-label">Residential Address (Optional)</label>
            <textarea id="address" name="address" class="form-input" rows="3">{{ patient.address or '' }}</textarea>
        </div>

        <div style="display: flex; gap: 12px; border-top: 1px solid var(--border); padding-top: 24px;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('patients.view_patient', id=patient.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
        
    </form>
</div>
{% endblock %}
